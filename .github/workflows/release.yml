name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish WinUI 3
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          tar -a -cf "CodexSwitch-$ver-windows-x64.zip" -C dist/windows-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: CodexSwitch-*-windows-x64.zip

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify bundled mihomo
        run: bash scripts/fetch-mihomo-macos.sh
      - name: Test and package SwiftUI
        env:
          MIHOMO_BINARY: ${{ github.workspace }}/dist/mihomo-macos/mihomo
          MIHOMO_LICENSE: ${{ github.workspace }}/src/Linux/kernel/LICENSE
        run: bash scripts/build-macos.sh
      - name: Archive app preserving permissions
        run: |
          test "$(uname -m)" = arm64
          ver="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent "dist/macos/Codex Switch.app" "CodexSwitch-${ver}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: CodexSwitch-*-macos-arm64.zip

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish
        run: bash scripts/build-linux.sh "${{ matrix.arch }}"
      - name: Archive
        run: |
          ver="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.arch }}"
          stage="$(mktemp -d)"
          name="CodexSwitch-${ver}-linux-${arch}"
          mkdir -p "$stage/$name"
          cp -a "dist/linux-${arch}/." "$stage/$name/"
          tar -C "$stage" -czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: CodexSwitch-*-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes="$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          cd packages
          for suffix in windows-x64.zip macos-arm64.zip linux-x64.tar.gz linux-arm64.tar.gz; do
            test -f "CodexSwitch-${ver}-${suffix}"
          done
          sha256sum CodexSwitch-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "$ver" \
            --notes-file "$notes" \
            CodexSwitch-* SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
